<div class="min-h-screen flex flex-col bg-white dark:bg-gray-900 transition-colors duration-200">

  <!-- ── Header ──────────────────────────────────────────────── -->
  <header class="border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 transition-colors duration-200">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-lg bg-primary-600 dark:bg-primary-500 flex items-center justify-center shrink-0 transition-colors duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4.5 4.5a3 3 0 0 0-3 3v9a3 3 0 0 0 3 3h8.25a3 3 0 0 0 3-3v-9a3 3 0 0 0-3-3H4.5ZM19.94 18.75l-2.69-2.69V7.94l2.69-2.69c.944-.945 2.56-.276 2.56 1.06v11.38c0 1.336-1.616 2.005-2.56 1.06Z"/>
          </svg>
        </div>
        <span class="font-semibold text-gray-900 dark:text-white">Video Interview</span>
      </div>
      <app-theme-toggle />
    </div>

    <!-- Step progress bar -->
    <div class="max-w-3xl mx-auto px-6 pb-5">
      <div class="flex items-center">
        @for (step of steps; track step.path; let i = $index) {
          <!-- Step circle -->
          @if (isCompleted(i)) {
            <div class="h-7 w-7 rounded-full bg-primary-600 dark:bg-primary-500 text-white flex items-center justify-center shrink-0 transition-colors duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" clip-rule="evenodd"/>
              </svg>
            </div>
          } @else if (isActive(i)) {
            <div class="h-7 w-7 rounded-full bg-primary-600 dark:bg-primary-500 text-white flex items-center justify-center shrink-0 ring-4 ring-primary-100 dark:ring-primary-900/40 transition-colors duration-200">
              <span class="text-xs font-bold">{{ i + 1 }}</span>
            </div>
          } @else {
            <div class="h-7 w-7 rounded-full border-2 border-gray-200 dark:border-gray-700 text-gray-400 dark:text-gray-500 flex items-center justify-center shrink-0 transition-colors duration-200">
              <span class="text-xs font-bold">{{ i + 1 }}</span>
            </div>
          }

          <!-- Step label (hidden on small screens) -->
          <span class="ml-2 text-sm font-medium hidden sm:block transition-colors duration-200"
                [class]="isActive(i) ? 'text-primary-600 dark:text-primary-400'
                        : isCompleted(i) ? 'text-gray-700 dark:text-gray-300'
                        : 'text-gray-400 dark:text-gray-500'">
            {{ step.label }}
          </span>

          <!-- Connector line -->
          @if (i < steps.length - 1) {
            <div class="flex-1 mx-3">
              @if (isCompleted(i)) {
                <div class="h-0.5 bg-primary-500 dark:bg-primary-400 transition-colors duration-200"></div>
              } @else {
                <div class="h-0.5 bg-gray-200 dark:bg-gray-700 transition-colors duration-200"></div>
              }
            </div>
          }
        }
      </div>
    </div>
  </header>

  <!-- ── Animated route outlet ────────────────────────────────── -->
  <main class="flex-1">
    <div [@routeAnimations]="progress.stepIndex()">
      <router-outlet />
    </div>
  </main>

</div>
